<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Metallic gold / silver -->
    <linearGradient id="metal" x1="20" y1="105" x2="108" y2="20">
      <stop offset="0%" stop-color="#8A6A2F"/>
      <stop offset="22%" stop-color="#D4AF5A"/>
      <stop offset="45%" stop-color="#FFF1B8"/>
      <stop offset="62%" stop-color="#C7C7C7"/>
      <stop offset="82%" stop-color="#F4F4F4"/>
      <stop offset="100%" stop-color="#8F8F8F"/>
    </linearGradient>

    <!-- Dark metallic gradient -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#C5A45A" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>

    <!-- Background -->
    <radialGradient id="background" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1D1D1D"/>
      <stop offset="55%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>

    <!-- Fine technical grid -->
    <pattern
      id="grid"
      width="16"
      height="16"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M16 0H0V16"
        fill="none"
        stroke="#FFFFFF"
        stroke-width=".6"
        stroke-opacity=".035"
      />
    </pattern>

    <!-- Soft gold glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="frame">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Black foundation -->
    <rect width="128" height="128" fill="#020202"/>
    <rect width="128" height="128" fill="url(#background)"/>

    <!-- Almost invisible grid -->
    <rect width="128" height="128" fill="url(#grid)"/>

    <!-- Large orbital detail -->
    <circle
      cx="64"
      cy="64"
      r="48"
      fill="none"
      stroke="url(#metalDark)"
      stroke-width="1"
      stroke-opacity=".22"
      stroke-dasharray="1 7"
    />

    <circle
      cx="64"
      cy="64"
      r="40"
      fill="none"
      stroke="#FFFFFF"
      stroke-width=".7"
      stroke-opacity=".07"
    />

    <!-- Architectural corner lines -->
    <path
      d="M14 39V14H39"
      fill="none"
      stroke="url(#metalDark)"
      stroke-width="1"
      stroke-opacity=".65"
    />

    <path
      d="M89 114H114V89"
      fill="none"
      stroke="url(#metalDark)"
      stroke-width="1"
      stroke-opacity=".65"
    />

    <!-- Fine diagonal construction lines -->
    <path
      d="M18 91L37 72"
      stroke="#FFFFFF"
      stroke-width=".7"
      stroke-opacity=".12"
    />

    <path
      d="M91 37L110 18"
      stroke="#FFFFFF"
      stroke-width=".7"
      stroke-opacity=".12"
    />

    <!-- Gold nodes -->
    <circle cx="14" cy="39" r="1.7" fill="#D4AF5A"/>
    <circle cx="114" cy="89" r="1.7" fill="#D4AF5A"/>

    <!-- Subtle J glow -->
    <path
      d="M43 28
         H81
         M70 28
         V72
         C70 87 63 96 50 96
         C38 96 31 89 31 78"
      fill="none"
      stroke="#D4AF5A"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity=".12"
      filter="url(#glow)"
    />

    <!-- Main J -->
    <path
      d="M43 28
         H81
         M70 28
         V72
         C70 87 63 96 50 96
         C38 96 31 89 31 78"
      fill="none"
      stroke="url(#metal)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- White inner highlight -->
    <path
      d="M47 33H65V69"
      fill="none"
      stroke="#FFFFFF"
      stroke-width=".8"
      stroke-linecap="round"
      stroke-opacity=".8"
    />

    <!-- Small signature mark -->
    <path
      d="M79 25L91 37"
      fill="none"
      stroke="url(#metal)"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <circle
      cx="91"
      cy="37"
      r="2"
      fill="#D4AF5A"
    />

    <!-- Lower signature line -->
    <path
      d="M30 105H56"
      fill="none"
      stroke="url(#metal)"
      stroke-width="1.4"
      stroke-linecap="round"
    />

    <circle
      cx="61"
      cy="105"
      r="1.3"
      fill="#FFFFFF"
      opacity=".75"
    />

    <!-- Outer frame -->
    <rect
      x=".75"
      y=".75"
      width="126.5"
      height="126.5"
      rx="27.25"
      fill="none"
      stroke="url(#metalDark)"
      stroke-width="1.4"
      stroke-opacity=".35"
    />

  </g>
</svg>